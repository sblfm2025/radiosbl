<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Cache Dev Radio SBL</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      main {
        width: min(480px, calc(100vw - 32px));
        padding: 24px;
        background: #ffffff;
        border: 1px solid #dbe4f0;
        border-radius: 8px;
        box-shadow: 0 18px 48px rgba(23, 32, 51, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0 0 16px;
        line-height: 1.5;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 80px;
        padding: 12px;
        background: #edf2f7;
        border-radius: 6px;
      }

      a {
        color: #1665d8;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset Cache Dev Radio SBL</h1>
      <p>Halaman ini membersihkan service worker dan cache lama untuk origin dev saat layar blank.</p>
      <pre id="log">Mulai membersihkan cache...</pre>
      <p><a href="/">Kembali ke aplikasi</a></p>
    </main>
    <script>
      const log = document.getElementById("log");
      const write = (message) => {
        log.textContent += `\n${message}`;
      };

      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
            write(`Service worker dihapus: ${registrations.length}`);
          } else {
            write("Service worker tidak didukung browser ini.");
          }

          if ("caches" in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
            write(`Cache Storage dihapus: ${cacheNames.length}`);
          } else {
            write("Cache Storage tidak tersedia.");
          }

          write("Selesai. Silakan kembali ke aplikasi lalu hard reload jika perlu.");
        } catch (error) {
          write(`Gagal membersihkan: ${error instanceof Error ? error.message : String(error)}`);
        }
      })();
    </script>
  </body>
</html>
